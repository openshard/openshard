name: Release

# The only path to PyPI. Triggered by pushing a v* tag; every job checks out
# that exact tag, so a release can never contain anything that is not in git
# at the tagged commit. No API token is stored anywhere: publishing uses
# PyPI Trusted Publishing (OIDC) through the `pypi` environment.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    name: Verify tag matches pyproject.toml
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Tag version must equal pyproject.toml version
        id: check
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python - <<'EOF'
          import os, re, sys, tomllib
          tag = os.environ["TAG"]
          if not re.fullmatch(r"v\d+\.\d+\.\d+([ab]\d+|rc\d+)?", tag):
              sys.exit(f"tag {tag!r} is not of the form vX.Y.Z")
          with open("pyproject.toml", "rb") as fh:
              version = tomllib.load(fh)["project"]["version"]
          if tag[1:] != version:
              sys.exit(f"tag {tag} does not match pyproject.toml version {version}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"version={version}\n")
          print(f"ok: {tag} == {version}")
          EOF

      - name: Tag must be reachable from main
        run: |
          git fetch --no-tags --depth=200 origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::tagged commit is not on main"; exit 1; }

  test:
    name: Test (${{ matrix.os }}, py${{ matrix.python-version }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check .

      - name: Type check
        run: python -m mypy openshard/ --ignore-missing-imports

      - name: Test
        run: python -m pytest

  build:
    name: Build wheel and sdist
    needs: [verify, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build
        run: |
          pip install build twine
          python -m build

      - name: The build must not have touched the checked-out tree
        run: |
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            git status --porcelain
            echo "::error::tracked files changed during the build"
            exit 1
          fi

      - name: twine check
        run: python -m twine check --strict dist/*

      - name: Built artifacts carry the tagged version
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          ls -l dist/
          for f in dist/*; do
            case "$f" in
              *"openshard-${VERSION}-"*.whl|*"openshard-${VERSION}.tar.gz") ;;
              *) echo "::error::unexpected artifact $f for version $VERSION"; exit 1 ;;
            esac
          done

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI (Trusted Publishing)
    needs: [verify, build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/openshard/${{ needs.verify.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          print-hash: true

  github-release:
    name: Create GitHub Release
    needs: [verify, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          # The "## <version> - <date>" section, up to the next "## " heading.
          awk -v v="$VERSION" '
            /^## / { on = ($2 == v) ; if (on) next }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::no CHANGELOG.md section for $VERSION"; exit 1
          fi
          if grep -qi "^## $VERSION - Unreleased" CHANGELOG.md; then
            echo "::error::CHANGELOG.md still marks $VERSION as Unreleased"; exit 1
          fi
          cat notes.md

      - name: Create release and attach artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/* \
            --verify-tag \
            --title "OpenShard $TAG" \
            --notes-file notes.md
