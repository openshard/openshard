name: Openshard Cloud Receipts

on:
  push:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Optional ancestor commit to verify and capture"
        required: false
        type: string
      unattributed:
        description: "Create a CI/commit-level Receipt with agent, model, tokens and cost unknown when the commit has no Openshard-Agent evidence"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read
  id-token: write

env:
  PYTHON_VERSION: "3.12"
  UV_SYSTEM_PYTHON: "1"

jobs:
  capture:
    name: Verify and capture cloud-agent commits
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Install
        run: uv pip install -e ".[dev]"

      - name: Verify and create hosted Receipts
        env:
          GH_TOKEN: ${{ github.token }}
          OPENSHARD_API_BASE: https://api.openshard.dev
          OPENSHARD_OIDC_AUDIENCE: openshard-cloud-capture
          OPENSHARD_CAPTURE_COMMIT_SHA: ${{ inputs.commit_sha }}
          OPENSHARD_CAPTURE_UNATTRIBUTED: ${{ inputs.unattributed }}
        shell: bash
        run: |
          set -uo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            capture_sha="${OPENSHARD_CAPTURE_COMMIT_SHA:-$GITHUB_SHA}"
            if [[ ! "$capture_sha" =~ ^[0-9a-f]{40}$ ]] || ! git merge-base --is-ancestor "$capture_sha" "$GITHUB_SHA"; then
              echo "Requested capture commit must be an ancestor of this workflow ref."
              exit 1
            fi
            shas=$(jq -cn --arg sha "$capture_sha" '[$sha]')
          else
            # A commit may carry explicit Openshard metadata either in its own
            # trailers or in the associated PR body. Inspect every pushed commit
            # and fail closed later when neither source names an agent.
            shas=$(jq -c '[.commits[]?.id]' "$GITHUB_EVENT_PATH")
          fi

          pr_body_for_sha() {
            local target_sha="$1" prs
            prs=$(curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${target_sha}/pulls") || return 1
            jq -r 'map(select(.merged_at != null)) as $merged | ($merged[0].body // .[0].body // empty)' <<<"$prs"
          }

          has_agent_metadata() {
            local target_sha="$1" commit_message pr_body
            commit_message=$(git show -s --format=%B "$target_sha") || return 1
            if grep -qi '^Openshard-Agent:[[:space:]]*' <<<"$commit_message"; then
              return 0
            fi
            pr_body=$(pr_body_for_sha "$target_sha") || return 1
            grep -qi '^Openshard-Agent:[[:space:]]*' <<<"$pr_body"
          }

          # An explicit trailer can recover a missed Receipt without rewriting
          # history. Only tagged ancestors of the requesting commit are allowed.
          required_shas="$shas"
          backfill_shas='[]'
          while IFS= read -r request_sha; do
            request_message=$(git show -s --format=%B "$request_sha")
            request_pr_body=$(pr_body_for_sha "$request_sha" || true)
            request_metadata=$(printf '%s\n%s\n' "$request_message" "$request_pr_body")
            while IFS= read -r capture_sha; do
              if [[ ! "$capture_sha" =~ ^[0-9a-f]{40}$ ]] || ! git merge-base --is-ancestor "$capture_sha" "$request_sha"; then
                echo "Receipt backfill must name an ancestor commit."
                exit 1
              fi
              if ! has_agent_metadata "$capture_sha"; then
                echo "Receipt backfill must name a commit with explicit Openshard-Agent metadata in the commit or associated PR."
                exit 1
              fi
              backfill_shas=$(jq -c --arg sha "$capture_sha" '. + [$sha] | unique' <<<"$backfill_shas")
              if [[ "$(jq 'length' <<<"$backfill_shas")" -gt 10 ]]; then
                echo "At most ten Receipt backfills are allowed per run."
                exit 1
              fi
            done < <(printf '%s\n' "$request_metadata" | sed -n 's/^Openshard-Capture-Commit:[[:space:]]*//Ip')
          done < <(jq -r '.[]' <<<"$required_shas")
          shas=$(jq -cn --argjson backfill "$backfill_shas" --argjson required "$required_shas" '$required + $backfill | reduce .[] as $sha ([]; if index($sha) then . else . + [$sha] end)')

          if [[ "$(jq 'length' <<<"$shas")" -eq 0 ]]; then
            echo "No tagged cloud-agent commits in this push."
            exit 0
          fi



          # A merge push can include commits already captured on its branch.
          # Accept only this commit's explicit immutable-Receipt conflict;
          # never overwrite it or turn a failed check into a passed Receipt.
          deliver_receipt() {
            local response_file http_status response expected_id
            delivery_outcome=acknowledged
            [[ "${GITHUB_REPOSITORY_ID:-}" =~ ^[0-9]+$ ]] || return 1
            expected_id="rcpt_$(printf 'github-cloud:\0%s\0%s' "$GITHUB_REPOSITORY_ID" "$sha" | sha256sum | cut -c1-32)"
            response_file=$(mktemp) || return 1
            if ! http_status=$(curl -sS --connect-timeout 10 --max-time 30 \
              -o "$response_file" -w '%{http_code}' \
              -X POST "${OPENSHARD_API_BASE}/v1/cloud/github/receipts" \
              -H "Authorization: Bearer ${oidc_token}" \
              -H "Content-Type: application/json" --data "$payload"); then
              rm -f "$response_file"
              echo "::error::Receipt delivery transport failed for $sha."
              return 1
            fi
            response=$(cat "$response_file")
            rm -f "$response_file"
            if [[ "$http_status" == 200 || "$http_status" == 201 ]] && \
              jq -e --arg id "$expected_id" '.receipt_id == $id' <<<"$response" >/dev/null; then
              echo "Captured $expected_id for $sha ($verification_status)"
              return 0
            fi
            if [[ "$http_status" == 200 || "$http_status" == 201 ]] && \
              jq -e --arg sha "$sha" '
                .outcome == "verification_attached"
                and .head_sha == $sha
                and (.attached | type == "array" and length > 0)
              ' <<<"$response" >/dev/null; then
              echo "Attached independent CI verification for $sha ($verification_status)"
              return 0
            fi
            if [[ "$http_status" == 200 ]] && \
              jq -e --arg sha "$sha" '.outcome == "no_bound_receipt" and .head_sha == $sha' <<<"$response" >/dev/null; then
              delivery_outcome=no_bound_receipt
              echo "No captured Receipt is bound to $sha; its CI verdict was not recorded."
              return 0
            fi
            if [[ "$http_status" == 409 ]] && \
              jq -e --arg id "$expected_id" --arg code receipt_conflict \
                '.error.code == $code and (.error.message | contains($id))' <<<"$response" >/dev/null; then
              echo "::notice::Receipt $expected_id for $sha is already recorded; its original evidence is retained. This recheck was not appended."
              return 0
            fi
            echo "::error::Receipt delivery rejected for $sha (HTTP $http_status)."
            return 1
          }

          overall_failed=0
          delivered=0
          skipped=0
          {
            echo "## Cloud Receipt delivery"
            echo "| Commit | Outcome |"
            echo "| --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          while IFS= read -r sha; do
            echo "::group::Cloud Receipt $sha"

            commit=$(curl -fsSL               -H "Authorization: Bearer $GH_TOKEN"               -H "Accept: application/vnd.github+json"               "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${sha}")

            message=$(jq -r '.commit.message' <<<"$commit")
            task_title=$(jq -r '.commit.message | split("\n")[0]' <<<"$commit")
            created_at=$(jq -r '.commit.committer.date // .commit.author.date' <<<"$commit")
            parent=$(jq -r '.parents[0].sha // empty' <<<"$commit")
            file_count=$(jq '.files | length' <<<"$commit")
            files=$(jq -c '[.files[:50][] | {
              path: .filename,
              change_type: (
                if .status == "added" then "create"
                elif .status == "removed" then "delete"
                else "update"
                end
              ),
              additions: (.additions // 0),
              deletions: (.deletions // 0)
            }]' <<<"$commit")
            added=$(jq '.stats.additions // 0' <<<"$commit")
            removed=$(jq '.stats.deletions // 0' <<<"$commit")

            prs=$(curl -fsSL               -H "Authorization: Bearer $GH_TOKEN"               -H "Accept: application/vnd.github+json"               "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${sha}/pulls" || echo '[]')
            pr_body=$(jq -r 'map(select(.merged_at != null)) as $merged | ($merged[0].body // .[0].body // empty)' <<<"$prs")
            pr_url=$(jq -r 'map(select(.merged_at != null)) as $merged | ($merged[0].html_url // .[0].html_url // empty)' <<<"$prs")

            metadata_value() {
              local key="$1" value
              value=$(printf '%s\n' "$message" | sed -n "s/^${key}:[[:space:]]*//Ip" | tail -1)
              if [[ -z "$value" && -n "$pr_body" ]]; then
                value=$(printf '%s\n' "$pr_body" | sed -n "s/^${key}:[[:space:]]*//Ip" | tail -1)
              fi
              printf '%s' "$value"
            }

            owner=$(metadata_value "Openshard-Owner")
            agent=$(metadata_value "Openshard-Agent")
            model=$(metadata_value "Openshard-Model")
            provider=$(metadata_value "Openshard-Provider")
            surface=$(metadata_value "Openshard-Surface")
            cost=$(metadata_value "Openshard-Cost-USD")
            tokens_in=$(metadata_value "Openshard-Tokens-Input")
            tokens_out=$(metadata_value "Openshard-Tokens-Output")
            tokens_cache_read=$(metadata_value "Openshard-Tokens-Cache-Read")
            tokens_cache_creation=$(metadata_value "Openshard-Tokens-Cache-Creation")

            [[ -n "$owner" ]] || owner=$(jq -r '.commit.author.name // empty' <<<"$commit")
            unattributed=false
            attach_only=false
            if [[ -z "$agent" && "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "${OPENSHARD_CAPTURE_UNATTRIBUTED:-false}" == "true" ]]; then
              # An explicit retrospective request: record the commit and CI
              # verdict only. No agent or usage is inferred or declared.
              unattributed=true
              model="" provider="" surface="" cost="" tokens_in="" tokens_out="" tokens_cache_read="" tokens_cache_creation=""
              echo "::notice::Creating an unattributed CI/commit Receipt for $sha; agent, model, tokens and cost stay unknown."
            fi
            if [[ -z "$agent" && "$unattributed" != true && "$GITHUB_EVENT_NAME" == "push" && "$sha" == "${GITHUB_SHA:-}" ]]; then
              # No agent metadata, but an observed session (Claude Code cloud
              # hooks) may already hold this commit's Receipt: the verdict goes
              # only to a Receipt bound to it, and nothing is created otherwise.
              attach_only=true
              model="" provider="" surface="" cost="" tokens_in="" tokens_out="" tokens_cache_read="" tokens_cache_creation=""
              echo "::notice::No agent metadata on $sha; its CI verdict goes only to a captured Receipt bound to it."
            fi
            if [[ -z "$agent" && "$unattributed" != true && "$attach_only" != true ]]; then
              echo "::warning::No Receipt created for $sha: missing Openshard-Agent evidence."
              echo "| $sha | Skipped: missing agent evidence |" >> "$GITHUB_STEP_SUMMARY"
              skipped=$((skipped + 1))
              if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then overall_failed=1; fi
              echo "::endgroup::"
              continue
            fi

            cost_provenance=""
            cost_is_estimate=false
            if [[ -n "$cost" ]]; then
              cost_provenance="cloud_runtime_reported"
            elif [[ -n "$model" && ( -n "$tokens_in" || -n "$tokens_out" || -n "$tokens_cache_read" || -n "$tokens_cache_creation" ) ]]; then
              estimated_cost=$(MODEL="$model" TOKENS_IN="${tokens_in:-0}" TOKENS_OUT="${tokens_out:-0}" TOKENS_CACHE_READ="${tokens_cache_read:-0}" TOKENS_CACHE_CREATION="${tokens_cache_creation:-0}" python -c 'import os; from openshard.models.pricing import estimate_usage_cost; e=estimate_usage_cost(os.environ.get("MODEL"), input_tokens=int(os.environ.get("TOKENS_IN") or 0), output_tokens=int(os.environ.get("TOKENS_OUT") or 0), cache_read_tokens=int(os.environ.get("TOKENS_CACHE_READ") or 0), cache_write_tokens=int(os.environ.get("TOKENS_CACHE_CREATION") or 0)); print("" if e is None else f"{e.usd:.12f}")')
              if [[ -n "$estimated_cost" ]]; then
                cost="$estimated_cost"
                cost_provenance="official_rate_estimate"
                cost_is_estimate=true
              fi
            fi
            [[ -n "$cost_provenance" ]] || cost_provenance="not_exposed_by_cloud_runtime"

            git checkout --force "$sha" >/dev/null 2>&1

            verify_started=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
            start_epoch=$(date +%s)

            checks='[]'
            failed=0

            run_check() {
              local name="$1"
              local kind="$2"
              shift 2
              echo "Running $name..."
              local rc=0
              "$@" || rc=$?
              local status="passed"
              if [[ $rc -ne 0 ]]; then
                status="failed"
                failed=1
              fi
              checks=$(jq -c                 --arg name "$name"                 --arg kind "$kind"                 --arg status "$status"                 --argjson rc "$rc"                 '. + [{name:$name,kind:$kind,status:$status,exit_code:$rc}]' <<<"$checks")
            }

            run_check "Ruff" "lint" python -m ruff check .
            run_check "mypy" "typecheck" python -m mypy openshard/ --ignore-missing-imports
            run_check "pytest" "test" python -m pytest -n auto --durations=15

            verify_completed=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
            duration=$(( $(date +%s) - start_epoch ))
            verification_status="passed"
            if [[ $failed -ne 0 ]]; then
              verification_status="failed"
              if [[ "$attach_only" == true ]]; then
                echo "::warning::$sha failed verification; that result is delivered as CI evidence only."
              else
                overall_failed=1
              fi
            fi

            files_truncated=false
            [[ "$file_count" -gt 50 ]] && files_truncated=true

            payload=$(jq -cn               --arg head_sha "$sha"               --arg before_sha "$parent"               --arg created_at "$created_at"               --arg task_title "$task_title"               --arg branch "$GITHUB_REF_NAME"               --arg owner "$owner"               --arg agent "$agent"               --arg model "$model"               --arg provider "$provider"               --arg surface "$surface"               --arg pr_url "$pr_url"               --arg cost "$cost"               --arg cost_provenance "$cost_provenance"               --argjson cost_is_estimate "$cost_is_estimate"               --arg tokens_in "$tokens_in"               --arg tokens_out "$tokens_out"               --arg tokens_cache_read "$tokens_cache_read"               --arg tokens_cache_creation "$tokens_cache_creation"               --arg verify_started "$verify_started"               --arg verify_completed "$verify_completed"               --arg verification_status "$verification_status"               --argjson duration "$duration"               --argjson checks "$checks"               --argjson files "$files"               --argjson files_truncated "$files_truncated"               --argjson diff_added "$added"               --argjson diff_removed "$removed"               --argjson attach_only "$attach_only"               '{
                head_sha: $head_sha,
                before_sha: (if $before_sha == "" then null else $before_sha end),
                created_at: $created_at,
                task_title: $task_title,
                branch: $branch,
                owner: (if $owner == "" then null else $owner end),
                agent: (if $agent == "" then null else $agent end),
                model: (if $model == "" then null else $model end),
                provider: (if $provider == "" then null else $provider end),
                surface: (if $surface == "" then null else $surface end),
                pr_url: (if $pr_url == "" then null else $pr_url end),
                cost_usd: (if $cost == "" then null else ($cost | tonumber) end),
                cost_provenance: $cost_provenance,
                cost_is_estimate: $cost_is_estimate,
                tokens_input: (if $tokens_in == "" then null else ($tokens_in | tonumber) end),
                tokens_output: (if $tokens_out == "" then null else ($tokens_out | tonumber) end),
                tokens_cache_read: (if $tokens_cache_read == "" then null else ($tokens_cache_read | tonumber) end),
                tokens_cache_creation: (if $tokens_cache_creation == "" then null else ($tokens_cache_creation | tonumber) end),
                tokens_provenance: (if ($tokens_in == "" and $tokens_out == "" and $tokens_cache_read == "" and $tokens_cache_creation == "") then "not_exposed_by_cloud_runtime" else "cloud_runtime_reported" end),
                verification: {
                  status: $verification_status,
                  started_at: $verify_started,
                  completed_at: $verify_completed,
                  duration_seconds: $duration,
                  checks: $checks
                },
                files: $files,
                files_truncated: $files_truncated,
                diff_added: $diff_added,
                diff_removed: $diff_removed
              } + (if $attach_only then {attach_only: true} else {} end)')

            # Mint immediately before delivery: verifying several commits can outlive a token.
            oidc_response=$(curl -fsSL             -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"             "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OPENSHARD_OIDC_AUDIENCE}")
            oidc_token=$(jq -r '.value' <<<"$oidc_response")
            [[ -n "$oidc_token" && "$oidc_token" != "null" ]] || exit 1

            if ! deliver_receipt; then
              echo "| $sha | Delivery failed |" >> "$GITHUB_STEP_SUMMARY"
              if jq -e --arg sha "$sha" 'index($sha) != null' <<<"$required_shas" >/dev/null; then
                overall_failed=1
              else
                echo "::warning::Receipt backfill delivery for $sha failed."
              fi
            else
              if [[ "$delivery_outcome" == no_bound_receipt ]]; then
                echo "| $sha | Skipped: no agent metadata and no captured session Receipt |" >> "$GITHUB_STEP_SUMMARY"
                skipped=$((skipped + 1))
              elif [[ "$unattributed" == true ]]; then
                delivered=$((delivered + 1))
                echo "| $sha | Unattributed CI/commit Receipt acknowledged |" >> "$GITHUB_STEP_SUMMARY"
              else
                delivered=$((delivered + 1))
                echo "| $sha | API acknowledged or verification attached |" >> "$GITHUB_STEP_SUMMARY"
              fi
            fi

            echo "::endgroup::"
          done < <(jq -r '.[]' <<<"$shas")

          echo "Delivery acknowledgements: $delivered; skipped: $skipped. Green CI does not guarantee Receipt creation." >> "$GITHUB_STEP_SUMMARY"
          exit "$overall_failed"
