name: Openshard gate

# Dogfoods the merge gate (root action.yml, docs/merge-gate.md) on this
# repository's own pull requests. Non-blocking: it is not a required check
# and continue-on-error keeps a gate failure from failing the run. GitHub
# runners hold no .openshard/ history, so it normally reports unknown.

on:
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    name: Openshard gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: ./
