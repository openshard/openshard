name: Openshard gate

# Dogfoods the merge gate (root action.yml, docs/merge-gate.md) on this
# repository's own pull requests. A failed verdict shows as a red check;
# whether it blocks merging is set by branch protection (required checks).

on:
  pull_request:

permissions:
  contents: read
  id-token: write  # OIDC token for the Platform's gate verdict (read-only audience)
  pull-requests: write  # the gate summary as one PR comment (action input `comment`)

jobs:
  gate:
    name: Openshard gate
    runs-on: ubuntu-latest
    timeout-minutes: 20  # wait-minutes (15) + 5, so the gate reports instead of being cancelled
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./
