name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same PR (or branch) supersedes the previous one --
# cancel whatever of it is still running instead of burning runner time
# on a commit nobody will look at.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # The 224 tests across these 7 files spin up a real background HTTP
  # capture service (threads, an OS-assigned socket, in one case a spawned
  # Node subprocess) and poll with real timeouts. They're correct under
  # pytest-xdist (each test gets its own tmp OPENSHARD_HOME and its own
  # free port -- see tests/conftest.py::_isolate_capture_service), but
  # running many of them at once multiplies thread/socket/process
  # contention, which is exactly where the observed Windows flakes have
  # come from. Keep them out of parallel runs and out of the Windows PR
  # gate; they still run -- serially -- in the fast Ubuntu gate on every
  # PR, and unrestricted on every OS/Python combination once code lands
  # on main (see test-full-matrix below).
  SERVICE_TEST_FILES: >-
    tests/test_claude_capture_service.py
    tests/test_cross_agent_capture.py
    tests/test_codex_capture.py
    tests/test_cursor_capture.py
    tests/test_opencode_capture.py
    tests/test_v044_capture_auth.py
    tests/test_v044_evidence_loss.py
  # A small, curated slice that exercises the code paths most likely to
  # regress specifically on Windows (util/home.py + util/git.py's
  # CREATE_NO_WINDOW handling, jsonl_store's atomic replace, claude_hooks'
  # path/CRLF handling, sandbox diff/apply, repo_map's git subprocess
  # calls, CLI entrypoints) without paying for the full suite on the
  # slowest, flakiest runner on every PR. None of these use the real
  # capture service.
  WINDOWS_SMOKE_TEST_FILES: >-
    tests/test_util_home_git.py
    tests/test_jsonl_store.py
    tests/test_claude_hooks.py
    tests/test_cli_claude_hooks.py
    tests/test_cli_doctor.py
    tests/test_cli_entrypoint.py
    tests/test_cli_repo_map.py
    tests/test_first_run_ux.py
    tests/test_repo_map.py
    tests/test_sandbox.py
    tests/test_sandbox_apply.py
    tests/test_sandbox_apply_receipts.py
    tests/test_sandbox_diff.py
    tests/test_adapters_wrap_exec.py

jobs:
  # Docs/README-only changes skip every heavy job below. A job that is
  # skipped via `if:` still reports (as "skipped"), which GitHub treats as
  # a passing required check, so branch protection keeps working -- this
  # is not a paths-ignore trigger, which would leave a required check
  # permanently pending on those PRs.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect whether this change is docs/README-only
        id: filter
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$base" 2>/dev/null; then
            echo "no usable base commit -- treating as a code change"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$base" "${{ github.sha }}")"
          echo "changed files:"
          echo "$changed"
          # Anything that is not one of these doc-ish patterns makes it a
          # code change. .github/workflows/** deliberately never matches,
          # so a workflow edit always gets the full run.
          if echo "$changed" | grep -qvE '^(README\.md|CHANGELOG\.md|CONTRIBUTING\.md|SECURITY\.md|NOTICE|LICENSE|docs/.*|.*\.md)$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: Lint + type check
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check .

      - name: Type check
        run: python -m mypy openshard/ --ignore-missing-imports

  # The primary PR gate: the full suite, once, on the fastest/most stable
  # combination (Ubuntu + 3.12). The 8639 tests with no real service
  # dependency run under pytest-xdist; the 224 capture/timing tests run
  # straight after, serially, so this gate still covers every test on
  # every PR -- it just doesn't parallelise the ones that aren't safe to.
  test-fast:
    name: Test (fast gate, ubuntu, py3.12)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Test (parallel-safe subset)
        run: |
          ignore_args=""
          for f in $SERVICE_TEST_FILES; do ignore_args="$ignore_args --ignore=$f"; done
          python -m pytest -n auto $ignore_args

      - name: Test (capture/timing services, serial)
        run: python -m pytest $SERVICE_TEST_FILES

  # A small, fast, curated Windows run that blocks every PR -- catches
  # Windows-specific regressions in the code paths that actually differ by
  # platform, without paying for (or trusting) the full suite on the
  # slowest and historically flakiest runner on every PR.
  test-windows-smoke:
    name: Test (Windows 3.12 smoke)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Test (Windows smoke subset)
        shell: bash
        run: python -m pytest -n auto $WINDOWS_SMOKE_TEST_FILES

  # Exhaustive compatibility: every test, every OS x Python combination,
  # unmodified and serial -- exactly what the matrix did before this
  # change. Runs after code lands on main instead of on every PR, so a
  # contributor is never blocked by it, but nothing ships to a release
  # without having passed here first (release.yml runs the same matrix
  # again before publishing).
  test-full-matrix:
    name: Test (full matrix, ${{ matrix.os }}, py${{ matrix.python-version }})
    needs: changes
    if: needs.changes.outputs.code == 'true' && github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Test
        run: python -m pytest
