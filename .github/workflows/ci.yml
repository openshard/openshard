name: Fast PR Gate

# The PR feedback loop. Proves enough to merge safely, as fast as the runners
# allow; the exhaustive OS x Python matrix runs after merge in
# main.yml ("Full Main Validation") and again before publishing in
# release.yml. See docs/ci.md for the tiers and the expected timings.
#
# Shape of a run:
#
#   Plan ─┬─ Lint + types
#         ├─ Tests (shard 1/N .. N/N)       parallel-safe files, pytest-xdist
#         ├─ Tests (capture services 1/2 ..)  serial within each job, never on Windows
#         └─ Tests (Windows smoke)           curated slice, only when relevant
#                                  └──────── Fast PR Gate (the one required check)
#
# scripts/ci/select_tests.py decides, from the changed files, which of those
# jobs run and with which test files. Docs-only PRs run nothing but Plan and
# the Gate; anything evidence-critical (receipts/history, capture adapters,
# verification, security, sync ...) or anything the selector cannot classify
# runs the full PR suite regardless of the size of the diff.

on:
  pull_request:
  workflow_dispatch:

# A new push to the same PR supersedes the previous run.
concurrency:
  group: pr-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  PYTHONUNBUFFERED: "1"
  # `uv pip install` targets the interpreter actions/setup-python put on PATH
  # instead of looking for a virtualenv.
  UV_SYSTEM_PYTHON: "1"

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tier: ${{ steps.plan.outputs.tier }}
      run_code: ${{ steps.plan.outputs.run_code }}
      run_shards: ${{ steps.plan.outputs.run_shards }}
      run_service: ${{ steps.plan.outputs.run_service }}
      windows: ${{ steps.plan.outputs.windows }}
      service_matrix: ${{ steps.plan.outputs.service_matrix }}
      windows_files: ${{ steps.plan.outputs.windows_files }}
      shard_matrix: ${{ steps.plan.outputs.shard_matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The selector diffs base...head with merge-base semantics, so it
          # needs the base branch's history, not just the merge commit.
          fetch-depth: 0

      - name: Select tests from the changed files
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ -z "$BASE_SHA" ]; then
            # workflow_dispatch: compare against where this ref left main.
            git fetch --no-tags origin main
            BASE_SHA="$(git merge-base origin/main "$HEAD_SHA")"
          fi
          # Stock python3 on the runner; the script is stdlib-only on purpose
          # so no dependency install sits on the critical path here.
          python3 scripts/ci/select_tests.py plan \
            --base "$BASE_SHA" --head "$HEAD_SHA" \
            --github-output "$GITHUB_OUTPUT" | tee plan.txt
          {
            echo "### Plan"
            echo '```'
            cat plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  lint:
    name: Lint + types
    needs: plan
    if: needs.plan.outputs.run_code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v10.2.0  # no v10 major alias is published yet
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Install
        run: uv pip install -e ".[dev]"
      - name: Ruff
        run: python -m ruff check .
      - name: mypy
        run: python -m mypy openshard/ --ignore-missing-imports
      - name: Test-selection lists still resolve
        run: python scripts/ci/select_tests.py check

  test:
    name: Tests (shard ${{ matrix.id }}/${{ matrix.of }})
    needs: plan
    if: needs.plan.outputs.run_shards == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.shard_matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v10.2.0  # no v10 major alias is published yet
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Install
        run: uv pip install -e ".[dev]"
      - name: Test (parallel-safe files, pytest-xdist)
        env:
          FILES: ${{ matrix.files }}
        # shellcheck disable=SC2086 -- FILES is a deliberate word list.
        run: python -m pytest -n auto --durations=15 $FILES

  # The capture/service tests spin up a real background HTTP capture service
  # (threads, an OS-assigned socket, in one case a spawned Node subprocess)
  # and poll with real timeouts. They are correct under xdist but contention
  # between many of them at once on one machine is exactly where the observed
  # Windows flakes came from, so each job runs its files strictly serially in
  # a single pytest process. The files are spread over (at most) two jobs:
  # separate runners are separate VMs, so nothing is shared between them.
  test-service:
    name: Tests (capture services, serial ${{ matrix.id }}/${{ matrix.of }})
    needs: plan
    if: needs.plan.outputs.run_service == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.service_matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v10.2.0  # no v10 major alias is published yet
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Install
        run: uv pip install -e ".[dev]"
      - name: Test (serial, one pytest process)
        env:
          FILES: ${{ matrix.files }}
        # shellcheck disable=SC2086
        run: python -m pytest --durations=15 $FILES

  # A curated slice of the code paths that actually differ by platform
  # (util/home.py + util/git.py, jsonl_store's atomic replace, claude_hooks'
  # path/CRLF handling, sandbox diff/apply, repo_map's git calls, CLI
  # entrypoints). None of these use the real capture service. Runs when the
  # plan says the change can reach them; the full suite runs on Windows
  # after merge.
  test-windows:
    name: Tests (Windows smoke)
    needs: plan
    if: needs.plan.outputs.windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v10.2.0  # no v10 major alias is published yet
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Install
        run: uv pip install -e ".[dev]"
      - name: Test (Windows smoke slice)
        shell: bash
        env:
          FILES: ${{ needs.plan.outputs.windows_files }}
        # shellcheck disable=SC2086
        run: python -m pytest -n auto --durations=15 $FILES

  # The single check to require in branch protection. Skipped jobs are fine
  # (that is the plan doing its job); anything that failed or was cancelled
  # fails the gate.
  gate:
    name: Fast PR Gate
    needs: [plan, lint, test, test-service, test-windows]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed or was intentionally skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
          TIER: ${{ needs.plan.outputs.tier }}
          PLAN_RESULT: ${{ needs.plan.result }}
        run: |
          echo "$RESULTS"
          {
            echo "### Fast PR Gate"
            echo
            echo "| job | result |"
            echo "|-----|--------|"
            echo "$RESULTS" | python3 -c '
          import json, sys
          for name, job in json.load(sys.stdin).items():
              print("| " + name + " | " + job["result"] + " |")
          '
            echo
            echo "tier: **${TIER:-unknown}**"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$PLAN_RESULT" != "success" ]; then
            echo "::error::the plan job did not succeed"; exit 1
          fi
          if echo "$RESULTS" | grep -Eq '"result": *"(failure|cancelled)"'; then
            echo "::error::a gate job failed"; exit 1
          fi
          echo "ok: gate green (tier: $TIER)"
