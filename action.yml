name: Openshard gate
description: >-
  Gate a pull request on its head commit's Receipt in the Openshard Platform:
  pass when verified, fail when verification failed, did not finish, or an
  agent change has no Receipt. Never a pass-with-warning.
author: Openshard
branding:
  icon: check-circle
  color: gray-dark

inputs:
  wait-minutes:
    description: "How long to wait while verification is pending, or while an agent change has no Receipt yet, before failing."
    required: false
    default: "10"
  api:
    description: "Openshard Platform API base."
    required: false
    default: "https://api.openshard.dev"
  api-key:
    description: "Organisation API key, for CI without GitHub OIDC. Pass it from a secret. Needs `org`."
    required: false
    default: ""
  org:
    description: "Organisation id for `api-key`."
    required: false
    default: ""
  commit:
    description: "Commit to gate. Default: the pull request's head commit, else the commit that triggered the run."
    required: false
    default: ""
  strict:
    description: "Deprecated, no effect: the gate only passes or fails."
    required: false
    default: ""
  python-version:
    description: "Python used to run Openshard (3.11 or later)."
    required: false
    default: "3.12"

outputs:
  status:
    description: "pass or fail"
    value: ${{ steps.gate.outputs.openshard_gate_status }}
  verdict:
    description: "The Platform's answer (verified, failed, pending, none) or why there was none (unreachable, auth, fork, no_credentials, timeout, ...)"
    value: ${{ steps.gate.outputs.openshard_gate_verdict }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}

    # Openshard is installed from this action's own checkout, so the gate is
    # exactly the version the workflow pinned with `uses: ...@<ref>`. It goes
    # into its own virtualenv so the job's Python environment is untouched.
    - name: Install Openshard
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        venv="$RUNNER_TEMP/openshard-gate"
        python -m venv "$venv"
        "$venv/bin/python" -m pip install --quiet --disable-pip-version-check "$ACTION_PATH" \
          || "$venv/Scripts/python" -m pip install --quiet --disable-pip-version-check "$ACTION_PATH"

    - name: Openshard gate
      id: gate
      shell: bash
      env:
        INPUT_COMMIT: ${{ inputs.commit }}
        INPUT_STRICT: ${{ inputs.strict }}
        INPUT_WAIT: ${{ inputs.wait-minutes }}
        OPENSHARD_GATE_API: ${{ inputs.api }}
        OPENSHARD_GATE_API_KEY: ${{ inputs.api-key }}
        OPENSHARD_GATE_ORG: ${{ inputs.org }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        set -uo pipefail
        venv="$RUNNER_TEMP/openshard-gate"
        bin="$venv/bin/openshard"
        [[ -x "$bin" ]] || bin="$venv/Scripts/openshard"
        if [[ -n "$INPUT_STRICT" ]]; then
          echo "::warning title=Openshard gate::The strict input is deprecated and has no effect: the gate only passes or fails."
        fi
        commit="${INPUT_COMMIT:-${PR_HEAD_SHA:-$GITHUB_SHA}}"
        rc=0
        out=$("$bin" ci gate --commit "$commit" --wait-minutes "$INPUT_WAIT" --github-step-summary --github-output) || rc=$?
        printf '%s\n' "$out"
        status=$(printf '%s\n' "$out" | sed -n 's/^Openshard gate: //p' | head -1)
        headline=$(printf '%s\n' "$out" | sed -n '2p')
        if [[ "$status" == pass && $rc -eq 0 ]]; then
          exit 0
        fi
        echo "::error title=Openshard gate::${headline:-The gate could not run.}"
        # Anything but an explicit pass is a failure, including a crash.
        [[ $rc -ne 0 ]] || rc=1
        exit "$rc"
